[project]
name = "bottlemap-backend"
version = "0.1.0"
description = "FastAPI backend for BottleMap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.32",
    "google-genai==2.28.0",
    "pillow==12.3.0",
    "boto3>=1.35,<2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI fails below this; database tests that silently skip would drop well under it.
fail_under = 98
