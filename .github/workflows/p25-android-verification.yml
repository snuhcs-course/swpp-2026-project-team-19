# P25 branch-only verification; remove after integration verification.
name: P25 Android Verification

on:
  push:
    branches:
      - feature/p25-frontend-api-integration

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use hosted SDK for compile smoke
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          sed -i 's/compileSdk = 37/compileSdk = 36/' android/app/build.gradle.kts
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
