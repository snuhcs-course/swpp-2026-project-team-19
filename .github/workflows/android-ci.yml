name: Android CI

# Do not use workflow-level path filters: a skipped workflow can leave PR checks Pending.
# Android jobs are skipped on unrelated changes; team policy requires manual merge review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Android / changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect Android changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/android-ci.yml'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'

  android-lint:
    name: Android / lint
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  android-unit-tests:
    name: Android / unit tests
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Run JUnit 4 local tests and generate JaCoCo coverage
        id: unit_test
        run: ./gradlew :app:createDebugUnitTestCoverageReport --no-daemon
      - name: Verify coverage report exists
        run: |
          test -s android/app/build/reports/coverage/test/debug/index.html
          grep -q 'Total' android/app/build/reports/coverage/test/debug/index.html
      - name: Summarize JUnit results and reject empty test runs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          variants = ("Debug",)
          files = []
          for variant in variants:
              variant_files = glob.glob(f"android/app/build/test-results/test{variant}UnitTest/TEST-*.xml")
              if not variant_files and os.environ.get("CI_TESTS_RAN") == "true":
                  raise SystemExit(f"No {variant} JUnit XML files; refusing an empty test run")
              files.extend(variant_files)
          counts = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for file in files:
              suite = ET.parse(file).getroot()
              for key in counts:
                  counts[key] += int(suite.attrib.get(key, "0"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Android JUnit 4 local tests\n\n")
              out.write("| Tests | Failures | Errors | Skipped |\n")
              out.write("|---:|---:|---:|---:|\n")
              out.write("| {tests} | {failures} | {errors} | {skipped} |\n".format(**counts))
          if counts["tests"] == 0 and os.environ.get("CI_TESTS_RAN") == "true":
              raise SystemExit("No JUnit tests executed; failing rather than accepting an empty test run")
          PY
        env:
          CI_TESTS_RAN: ${{ steps.unit_test.outcome == 'success' }}
      - name: Upload Android JVM coverage HTML
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-jvm-coverage
          path: android/app/build/reports/coverage/test/debug/**
          if-no-files-found: error
      - name: Upload unit-test XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/test-results/test*DebugUnitTest/**
            android/app/build/reports/tests/test*DebugUnitTest/**
          if-no-files-found: ignore

  android-debug-build:
    name: Android / debug APK
    needs: changes
    # A merge to main builds the deployed-server APK (android-deployed-build) instead.
    if: ${{ needs.changes.outputs.android == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      # Empty BuildConfig credentials are supported for compilation; this job never connects
      # to production Backend, Google, Supabase, or Kakao services.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify unified APK contents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apks = list(Path("android/app/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one unified debug APK, found {apks}")
          with ZipFile(apks[0]) as archive:
              dex = b"".join(archive.read(n) for n in archive.namelist() if n.endswith(".dex"))
          for name in (b"com/zerotoone/bottlemap/ui/owner/", b"OwnerCameraPhotoStorage", b"com/zerotoone/bottlemap/ui/customer/"):
              if name not in dex:
                  raise SystemExit(f"Unified APK missing required component: {name}")
          print(f"Unified APK: {apks[0]}")
          PY
      - name: Upload unified debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bottlemap-unified-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Only a merge to main builds an APK that talks to the deployed server and the production
  # Google, Supabase, and Kakao settings, taken with the team's registered debug keystore from
  # the Actions secrets below. Pull-request runs build without them. The secrets can be
  # repository secrets or secrets of the production environment.
  android-deployed-build:
    name: Android / deployed-server APK
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      BOTTLEMAP_API_BASE_URL: https://bottlemap.o-r.kr/
    steps:
      - name: Check deployed-server secrets
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          BOTTLEMAP_KAKAO_NATIVE_APP_KEY: ${{ secrets.BOTTLEMAP_KAKAO_NATIVE_APP_KEY }}
          BOTTLEMAP_SUPABASE_URL: ${{ secrets.BOTTLEMAP_SUPABASE_URL }}
          BOTTLEMAP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BOTTLEMAP_SUPABASE_PUBLISHABLE_KEY }}
          BOTTLEMAP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BOTTLEMAP_GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=()
          for name in ANDROID_DEBUG_KEYSTORE_BASE64 BOTTLEMAP_KAKAO_NATIVE_APP_KEY BOTTLEMAP_SUPABASE_URL \
              BOTTLEMAP_SUPABASE_PUBLISHABLE_KEY BOTTLEMAP_GOOGLE_WEB_CLIENT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Actions secrets: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      # Debug builds are signed with this keystore. Its SHA-1 (Google sign-in) and key hash
      # (Kakao Map) are already registered; a runner would otherwise create a new key each run.
      # AGP 9 uses $XDG_CONFIG_HOME/.android before ~/.android when that folder exists, as it can
      # on GitHub runners, so ANDROID_USER_HOME, which AGP checks first, points at the keystore.
      - name: Restore registered debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          android_user_home="${ANDROID_USER_HOME:-$HOME/.android}"
          keystore="$android_user_home/debug.keystore"
          mkdir -p "$android_user_home"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_USER_HOME=$android_user_home" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build debug APK for the deployed server
        env:
          ORG_GRADLE_PROJECT_BOTTLEMAP_API_BASE_URL: ${{ env.BOTTLEMAP_API_BASE_URL }}
          ORG_GRADLE_PROJECT_BOTTLEMAP_KAKAO_NATIVE_APP_KEY: ${{ secrets.BOTTLEMAP_KAKAO_NATIVE_APP_KEY }}
          ORG_GRADLE_PROJECT_BOTTLEMAP_SUPABASE_URL: ${{ secrets.BOTTLEMAP_SUPABASE_URL }}
          ORG_GRADLE_PROJECT_BOTTLEMAP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BOTTLEMAP_SUPABASE_PUBLISHABLE_KEY }}
          ORG_GRADLE_PROJECT_BOTTLEMAP_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BOTTLEMAP_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify unified APK contents and server URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          apks = list(Path("android/app/build/outputs/apk/debug").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one unified debug APK, found {apks}")
          with ZipFile(apks[0]) as archive:
              dex = b"".join(archive.read(n) for n in archive.namelist() if n.endswith(".dex"))
          for name in (b"com/zerotoone/bottlemap/ui/owner/", b"OwnerCameraPhotoStorage", b"com/zerotoone/bottlemap/ui/customer/"):
              if name not in dex:
                  raise SystemExit(f"Unified APK missing required component: {name}")
          url = os.environ["BOTTLEMAP_API_BASE_URL"]
          if url.encode() not in dex:
              raise SystemExit(f"APK does not use the deployed server {url}")
          print(f"Unified APK for {url}: {apks[0]}")
          PY
      - name: Verify APK is signed with the registered debug keystore
        shell: bash
        run: |
          apk="$(ls android/app/build/outputs/apk/debug/*.apk)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          if ! cert="$(keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey)"; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not a debug keystore (alias androiddebugkey, password android)"
            exit 1
          fi
          expected="$(awk '$1 == "SHA1:" {print $2}' <<<"$cert" | tr -d ':' | tr 'A-F' 'a-f')"
          # apksigner 37 prints "V2 Signer: certificate SHA-1 digest: <hex>"; older versions print
          # "Signer #1 certificate SHA-1 digest: <hex>". Fingerprints of the public certificate are not secret.
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | sort -u | paste -sd ' ' -)"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK is not signed with the registered debug keystore (APK SHA-1: ${actual:-none}, keystore SHA-1: ${expected:-none})"
            exit 1
          fi
          echo "APK is signed with the registered debug keystore"
      - name: Upload deployed-server debug APK
        uses: actions/upload-artifact@v7
        with:
          name: bottlemap-prod-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
