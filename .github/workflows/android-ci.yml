# AI-assisted with ChatGPT/GPT-6 for Hojin Nam (2026-10-18, I2-P37/P38). Human review pending.
name: Android CI

# Do not put paths filters here: required checks can remain Pending when a workflow is skipped.
# Detect Android changes in a job instead; unrelated PRs get skipped (successful) Android jobs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, feature/i2-p37-p38-android-ci-testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Android / changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect Android changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/android-ci.yml'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'

  android-lint:
    name: Android / lint
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-37'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  android-unit-tests:
    name: Android / unit tests
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-37'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Run JUnit 4 local tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Upload unit-test XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/**
            android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

  android-debug-build:
    name: Android / debug APK
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: sdkmanager --install 'platforms;android-37'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      # Empty BuildConfig credentials are supported for compilation; this job never connects
      # to production Backend, Google, Supabase, or Kakao services.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
