name: Owner Compose UI CI

# Always create the PR check, including for unrelated changes. Path detection
# happens inside the workflow so required checks do not remain Pending.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-compose-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Owner Compose / changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      owner: ${{ steps.filter.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect Owner Compose changes
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            owner:
              - 'android/**'
              - '.github/workflows/owner-compose-ui-ci.yml'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'

  owner-compose-ui:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.owner == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM access
        run: |
          sudo chmod 666 /dev/kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run Owner Compose instrumentation on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          # AGP's coverage task runs the same connected tests and generates JaCoCo HTML.
          # Explicit property keeps regular debug/deployed APKs free of instrumentation.
          script: ./gradlew :app:createDebugAndroidTestCoverageReport -PBOTTLEMAP_ANDROID_TEST_COVERAGE=true --no-daemon
      - name: Check Android instrumentation test inventory and skips
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s android/ci -p 'test_*.py'
          python3 android/ci/check_test_report.py instrumentation
      - name: Validate and summarize Compose instrumentation coverage
        run: python3 android/ci/report_coverage.py --kind instrumentation android/app/build/reports/coverage/androidTest/debug/connected
      - name: Upload Compose instrumentation coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-compose-coverage
          path: android/app/build/reports/coverage/androidTest/debug/connected/**
          if-no-files-found: warn
      - name: Upload Compose instrumentation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-compose-instrumentation-reports
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: ignore
