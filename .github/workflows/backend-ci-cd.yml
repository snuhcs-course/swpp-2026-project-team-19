name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "ai/catalog/**"
      - "eval/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ai/catalog/**"
      - "eval/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  # A newer push cancels an outdated PR run, but never a run on main that may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Only to post the test report as a PR comment.
      pull-requests: write
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Same major version as the RDS instance.
        image: postgres:18
        env:
          POSTGRES_USER: bottlemap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bottlemap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bottlemap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bottlemap
      POSTGRES_PASSWORD: ci-only-password
      # Only the test database is used; the tests rebuild its schema on every run.
      POSTGRES_DATABASE: bottlemap
      POSTGRES_TEST_DATABASE: bottlemap_test
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        # -rs lists skip reasons in the log; strict xfail makes a passing xfail test fail.
        run: >-
          uv run --no-sync pytest -rs -o xfail_strict=true
          --cov --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Collect the test lists of the PR and its base
        # Only to list removed tests in the summary; a collection that fails just skips the comparison.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_DIR: ${{ runner.temp }}/base
        run: |
          uv run --no-sync pytest --collect-only -q -p no:cacheprovider > head-tests.txt || rm -f head-tests.txt
          if git fetch --quiet --depth=1 origin "$BASE_SHA" && git worktree add --quiet --detach "$BASE_DIR" "$BASE_SHA"; then
            # The base's tests run with this PR's environment; only their IDs are needed.
            (cd "$BASE_DIR/backend" && "$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest --collect-only -q -p no:cacheprovider) \
              > base-tests.txt || rm -f base-tests.txt
          fi

      - name: Check test count, skips and removed tests
        # Fails when tests were deleted or skipped without being listed in backend/ci/test_policy.json.
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync python ci/check_test_report.py junit.xml --summary test-report.md
          ${{ github.event_name == 'pull_request' && '--base-tests base-tests.txt --head-tests head-tests.txt' || '' }}

      - name: Write the test report to the run summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "<details><summary>Backend coverage</summary>"
            echo
            uv run --no-sync coverage report --format=markdown
            echo
            echo "</details>"
          } >> test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the test report on the PR
        # One comment per PR, updated on every run. A failure here never fails the tests.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('backend/test-report.md') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- backend-test-report -->"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '%s\n%s\n\n[Workflow run](%s) for %s\n' "$marker" "$(cat test-report.md)" "$run_url" "${HEAD_SHA::7}")"
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
            backend/test-report.md
          if-no-files-found: ignore

  deploy:
    # Only main is deployed, and only after its tests pass. Pull requests stop at the tests.
    needs: backend-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://bottlemap.o-r.kr
    # One deployment at a time; a running one is never cancelled (migrations may be in progress).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      DEPLOY_HOST: bottlemap.o-r.kr
      DEPLOY_USER: ubuntu

    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The pinned host key: never connect to a server that answers with another one.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run deploy.sh on the server
        # The deploy key is restricted on the server to run `deploy.sh main`, whatever is sent.
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
          "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Check the deployed version
        # /health reports the commit the server started from; it must be this run's commit.
        run: |
          version=""
          for _ in $(seq 1 10); do
            version="$(curl -fsS "https://$DEPLOY_HOST/health" | jq -r '.version // empty')" || version=""
            if [ -n "$version" ] && [[ "$GITHUB_SHA" == "$version"* ]]; then
              echo "Deployed $version to https://$DEPLOY_HOST" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "::error::/health reports version '${version:-none}', expected ${GITHUB_SHA::7}. If main moved on during this run, a newer commit was deployed; check the latest run."
          exit 1
