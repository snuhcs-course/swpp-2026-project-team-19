name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "ai/catalog/**"
      - "eval/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ai/catalog/**"
      - "eval/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  # A newer push cancels an outdated PR run, but never a run on main that may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Same major version as the RDS instance.
        image: postgres:18
        env:
          POSTGRES_USER: bottlemap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bottlemap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bottlemap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bottlemap
      POSTGRES_PASSWORD: ci-only-password
      # Only the test database is used; the tests rebuild its schema on every run.
      POSTGRES_DATABASE: bottlemap
      POSTGRES_TEST_DATABASE: bottlemap_test
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml

      - name: Write coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Backend coverage"
            uv run --no-sync coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  deploy:
    # Only main is deployed, and only after its tests pass. Pull requests stop at the tests.
    needs: backend-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://bottlemap.o-r.kr
    # One deployment at a time; a running one is never cancelled (migrations may be in progress).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      DEPLOY_HOST: bottlemap.o-r.kr
      DEPLOY_USER: ubuntu

    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The pinned host key: never connect to a server that answers with another one.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run deploy.sh on the server
        # The deploy key is restricted on the server to run `deploy.sh main`, whatever is sent.
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
          "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Check the public endpoint
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://$DEPLOY_HOST/health"
